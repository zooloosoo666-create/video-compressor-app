<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Сжатие изображений</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:var(--tg-theme-bg-color,#fff); --fg:var(--tg-theme-text-color,#111);
    --hint:var(--tg-theme-hint-color,#777); --btn:var(--tg-theme-button-color,#2563eb);
    --btnfg:var(--tg-theme-button-text-color,#fff); --sec:var(--tg-theme-secondary-bg-color,#f1f2f4);
  }
  body{margin:0;padding:12px;font-family:system-ui,sans-serif;background:var(--bg);color:var(--fg);font-size:15px}
  h2{margin:4px 0 12px;font-size:20px}
  .card{background:var(--sec);border-radius:12px;padding:12px;margin-bottom:12px}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  input[type=number]{width:90px;padding:8px;font-size:15px;border-radius:8px;border:1px solid #ccc}
  select{padding:8px;font-size:15px;border-radius:8px}
  input[type=range]{flex:1;min-width:140px}
  button,.btn{padding:10px 14px;border:0;border-radius:8px;background:var(--btn);color:var(--btnfg);
    font-size:15px;text-decoration:none;display:inline-block;cursor:pointer}
  button.sec,.btn.sec{background:#8a8f98}
  button:disabled{opacity:.4}
  .drop{border:2px dashed var(--hint);border-radius:12px;padding:22px;text-align:center;color:var(--hint);cursor:pointer}
  .item{background:var(--bg);border-radius:10px;padding:10px;margin-top:8px}
  .item b{word-break:break-all}
  .muted{color:var(--hint);font-size:13px}
  .ok{color:#15803d}.err{color:#b91c1c}
  .bar{height:8px;background:#ddd;border-radius:4px;overflow:hidden;margin:6px 0}
  .bar>div{height:100%;background:var(--btn);width:0;transition:width .2s}
  .act{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .pair{display:flex;gap:8px;margin-top:8px}
  .pair img{max-width:48%;max-height:140px;border-radius:8px;object-fit:contain;background:#0001}
</style>
</head>
<body>
<h2>Сжатие изображений</h2>

<div class="card">
  <div class="drop" id="drop">Нажмите, чтобы выбрать фото (можно несколько)</div>
  <input type="file" id="fileInput" accept="image/*" multiple hidden>
</div>

<div class="card">
  <div class="row" style="margin-bottom:8px">
    <label>Большая сторона, px&nbsp;<input id="maxSide" type="number" value="1400" min="100" step="10"></label>
  </div>
  <div class="row" style="margin-bottom:8px">
    <label>Формат&nbsp;<select id="fmt">
      <option value="image/jpeg" selected>JPEG</option>
      <option value="image/webp">WebP</option>
      <option value="image/png">PNG</option>
    </select></label>
  </div>
  <div class="row">
    <span>Качество: <b id="qVal">85</b>%</span>
    <input id="quality" type="range" min="50" max="100" value="85">
  </div>
  <div class="muted">Фото меньше заданного размера не увеличиваются. Метаданные (EXIF, геолокация) при сохранении удаляются.</div>
</div>

<div class="card">
  <div class="row">
    <button id="startBtn" disabled>▶ Сжать всё</button>
    <button id="clearBtn" class="sec">Очистить</button>
  </div>
  <div class="muted" id="status">Добавьте фото</div>
  <div class="bar"><div id="overall"></div></div>
</div>

<div id="list"></div>

<script>
const tg = window.Telegram?.WebApp;
tg?.ready(); tg?.expand();

const MB = 1024 * 1024;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtKB = b => b < MB ? Math.round(b / 1024) + ' КБ' : (b / MB).toFixed(2) + ' МБ';
const EXT = { 'image/jpeg': 'jpg', 'image/webp': 'webp', 'image/png': 'png' };

const items = [];
let nextId = 1, running = false;

// ---------- обработка ----------
function loadImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => resolve({ img, url });
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('браузер не открывает файл')); };
    img.src = url;
  });
}

async function decode(file) {
  try {
    // createImageBitmap с учётом поворота из EXIF (фото с iPhone часто повёрнуты)
    const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
    return { source: bmp, w: bmp.width, h: bmp.height, done: () => bmp.close?.() };
  } catch {
    const { img, url } = await loadImage(file);
    return { source: img, w: img.naturalWidth, h: img.naturalHeight,
      done: () => URL.revokeObjectURL(url) };
  }
}

function toBlob(canvas, mime, q) {
  return new Promise(res => canvas.toBlob(res, mime, q));
}

async function resizeOne(file, maxSide, mime, q) {
  const d = await decode(file);
  try {
    if (!d.w || !d.h) throw new Error('нет изображения');
    const scale = Math.min(1, maxSide / Math.max(d.w, d.h));
    const nw = Math.max(1, Math.round(d.w * scale));
    const nh = Math.max(1, Math.round(d.h * scale));

    const canvas = document.createElement('canvas');
    canvas.width = nw; canvas.height = nh;
    const ctx = canvas.getContext('2d');
    if (mime === 'image/jpeg') { // прозрачный фон -> белый, иначе станет чёрным
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, nw, nh);
    }
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(d.source, 0, 0, nw, nh);

    let blob = await toBlob(canvas, mime, q);
    // Safari не умеет кодировать WebP и молча отдаёт PNG; тогда переходим на JPEG
    let outMime = mime;
    if (!blob || blob.type !== mime) {
      outMime = 'image/jpeg';
      const ctx2 = canvas.getContext('2d');
      const tmp = document.createElement('canvas');
      tmp.width = nw; tmp.height = nh;
      const c2 = tmp.getContext('2d');
      c2.fillStyle = '#fff'; c2.fillRect(0, 0, nw, nh);
      c2.drawImage(canvas, 0, 0);
      blob = await toBlob(tmp, 'image/jpeg', q);
    }
    if (!blob) throw new Error('не удалось сохранить изображение');
    return { blob, mime: outMime, w: nw, h: nh, srcW: d.w, srcH: d.h, resized: scale < 1 };
  } finally {
    d.done();
  }
}

// ---------- настройки ----------
function settings() {
  const maxSide = parseInt($('maxSide').value, 10);
  if (!(maxSide >= 100)) return null;
  return { maxSide, mime: $('fmt').value, q: $('quality').value / 100 };
}

// ---------- очередь ----------
async function startQueue() {
  const s = settings();
  if (!s) return alert('Укажите размер не меньше 100 px');
  const ready = items.filter(it => it.status === 'в очереди' || it.status === 'ошибка');
  if (!ready.length) return;

  running = true; render();
  let done = 0;
  for (const it of ready) {
    it.status = 'обработка'; render(); status(`Обработка ${done + 1} из ${ready.length}`);
    try {
      const r = await resizeOne(it.file, s.maxSide, s.mime, s.q);
      if (it.url) URL.revokeObjectURL(it.url);
      it.result = r;
      it.url = URL.createObjectURL(r.blob);
      it.outName = it.file.name.replace(/\.[^.]+$/, '') + `_${s.maxSide}px.${EXT[r.mime]}`;
      it.outFile = new File([r.blob], it.outName, { type: r.mime });
      it.status = 'готово';
    } catch (e) {
      it.status = 'ошибка'; it.msg = e.message;
    }
    done++;
    $('overall').style.width = (done / ready.length * 100) + '%';
    render();
  }
  running = false;
  status(`Готово: ${done} из ${ready.length}`);
  render();
}

// ---------- интерфейс ----------
function status(t) { $('status').textContent = t; }

async function addFiles(list) {
  for (const file of list) {
    if (!file.type.startsWith('image/') && !/\.(jpe?g|png|webp|heic|heif|gif|bmp)$/i.test(file.name)) continue;
    items.push({ id: nextId++, file, status: 'в очереди', msg: '', result: null, url: null, outFile: null, outName: '' });
  }
  $('overall').style.width = '0%';
  render();
}

function cardHTML(it) {
  const head = `<b>${esc(it.file.name)}</b>
    <div class="muted">${fmtKB(it.file.size)} · ${esc(it.status)}</div>`;
  if (it.status === 'готово') {
    const r = it.result;
    const saved = Math.round((1 - r.blob.size / it.file.size) * 100);
    const note = r.mime === 'image/jpeg' && $('fmt').value === 'image/webp'
      ? '<div class="muted">WebP в этом браузере не поддерживается, сохранён JPEG.</div>' : '';
    return `<div class="item">${head}
      <div class="ok">${r.srcW}×${r.srcH} → ${r.w}×${r.h}${r.resized ? '' : ' (без изменения размера)'} · ${fmtKB(r.blob.size)} (${saved >= 0 ? '−' : '+'}${Math.abs(saved)}%)</div>
      ${note}
      <div class="pair"><img src="${it.url}" alt=""></div>
      <div class="act">
        <a class="btn" href="${it.url}" download="${esc(it.outName)}">Скачать</a>
        ${navigator.canShare && navigator.canShare({ files: [it.outFile] })
          ? `<button class="sec" data-share="${it.id}">Поделиться</button>` : ''}
      </div></div>`;
  }
  if (it.status === 'ошибка') return `<div class="item">${head}<div class="err">Ошибка: ${esc(it.msg)}</div></div>`;
  return `<div class="item">${head}</div>`;
}

function render() {
  $('list').innerHTML = items.map(cardHTML).join('');
  const pending = items.some(it => it.status === 'в очереди' || it.status === 'ошибка');
  $('startBtn').disabled = running || !pending;
  $('clearBtn').disabled = running;
}

function clearAll() {
  if (running) return;
  items.forEach(it => it.url && URL.revokeObjectURL(it.url));
  items.length = 0;
  $('overall').style.width = '0%';
  status('Добавьте фото');
  render();
}

// ---------- события ----------
const drop = $('drop'), fi = $('fileInput');
drop.onclick = () => fi.click();
fi.onchange = () => { const files = [...fi.files]; fi.value = ''; addFiles(files); };
$('quality').oninput = e => $('qVal').textContent = e.target.value;
$('list').addEventListener('click', async e => {
  const b = e.target.closest('button[data-share]');
  if (!b) return;
  const it = items.find(x => x.id === +b.dataset.share);
  try { await navigator.share({ files: [it.outFile], title: it.outName }); } catch {}
});
$('startBtn').onclick = startQueue;
$('clearBtn').onclick = clearAll;
render();
</script>
</body>
</html>
